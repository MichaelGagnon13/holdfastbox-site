const D = {"segs": [{"type": "pipe", "a": [0.0, 0.0, 0.0], "b": [0.0, 7.5, 0.0], "cls": "coupe"}, {"type": "elbow", "a": [0.0, 7.5, 0.0]}, {"type": "pipe", "a": [0.0, 7.5, 0.0], "b": [0.0, 7.5, 20.430851063829788], "cls": "coupe"}, {"type": "valve", "a": [0.0, 7.5, 20.430851063829788], "b": [0.0, 7.5, 23.611702127659576]}, {"type": "pipe", "a": [0.0, 7.5, 23.611702127659576], "b": [0.0, 7.5, 25.079787234042556], "cls": "nipple"}, {"type": "union", "a": [0.0, 7.5, 25.079787234042556], "b": [0.0, 7.5, 27.281914893617024]}, {"type": "pipe", "a": [0.0, 7.5, 27.281914893617024], "b": [0.0, 7.5, 28.750000000000004], "cls": "nipple"}, {"type": "elbow", "a": [0.0, 7.5, 28.750000000000004]}, {"type": "pipe", "a": [0.0, 7.5, 28.750000000000004], "b": [16.294642857142858, 7.5, 28.750000000000004], "cls": "coupe"}, {"type": "te", "a": [16.294642857142858, 7.5, 28.750000000000004], "b": [16.294642857142858, 3.5, 28.750000000000004]}, {"type": "pipe", "a": [16.294642857142858, 7.5, 28.750000000000004], "b": [18.25, 7.5, 28.750000000000004], "cls": "nipple"}, {"type": "elbow", "a": [18.25, 7.5, 28.750000000000004]}], "labels": [{"p": [0.0, 0.0, 0.0], "t": "FACE", "kind": "end"}, {"p": [0.0, 3.75, 0.0], "d": "u", "t": "1", "sub": "7 1/8", "kind": "pipe", "cls": "coupe"}, {"p": [0.0, 7.5, 0.0], "t": "90", "kind": "end"}, {"p": [0.0, 7.5, 10.215425531914894], "d": "f", "t": "2", "sub": "20 7/8", "kind": "pipe", "cls": "coupe"}, {"p": [0.0, 7.5, 22.02127659574468], "d": "f", "t": "V", "kind": "valve"}, {"p": [0.0, 7.5, 24.345744680851066], "d": "f", "t": "3", "sub": "1 1/2", "kind": "pipe", "cls": "nipple"}, {"p": [0.0, 7.5, 26.18085106382979], "d": "f", "t": "U", "kind": "union"}, {"p": [0.0, 7.5, 28.015957446808514], "d": "f", "t": "4", "sub": "1 1/2", "kind": "pipe", "cls": "nipple"}, {"p": [0.0, 7.5, 28.750000000000004], "t": "90", "kind": "end"}, {"p": [8.147321428571429, 7.5, 28.750000000000004], "d": "r", "t": "5", "sub": "12 1/2", "kind": "pipe", "cls": "coupe"}, {"p": [16.294642857142858, 2.5, 28.750000000000004], "t": "drip", "kind": "te"}, {"p": [17.27232142857143, 7.5, 28.750000000000004], "d": "r", "t": "6", "sub": "1 1/2", "kind": "pipe", "cls": "nipple"}, {"p": [18.25, 7.5, 28.750000000000004], "t": "90", "kind": "end"}], "titre": "Retour 2", "sms": "Retour 2 1:7 1/8 | 2:20 7/8 valve 3:1 1/2 union 4:1 1/2 | 5:12 1/2 te 6:1 1/2", "stock": ["1 1/2", "2", "2 1/2", "3", "3 1/2", "4"], "drop": ""};
document.getElementById('sub').textContent = (D.drop?('descente '+D.drop+' · '):'') + (D.stock.length?('nipples : '+D.stock.join(', ')):'');
const list = document.getElementById('list');
for (const l of D.labels){
  if (l.kind==='pipe'){ const c = l.cls==='nipple'?'np':(l.cls==='coupe'?'cp':'ko');
    list.insertAdjacentHTML('beforeend', `<div class="${c}"><b>${l.t}</b> ${l.sub}${c==='ko'?' ⚠ pas en stock':''}</div>`); }
  else if (l.kind==='valve') list.insertAdjacentHTML('beforeend','<div class="fit">— valve —</div>');
  else if (l.kind==='union') list.insertAdjacentHTML('beforeend','<div class="fit">— union —</div>');
  else if (l.kind==='te') list.insertAdjacentHTML('beforeend','<div class="fit">— té (purge en bas) —</div>');
  else if (l.kind==='end' && (l.t==='90'||l.t==='45')) list.insertAdjacentHTML('beforeend',`<div class="fit">— coude ${l.t} —</div>`);
}
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c2230);   // fond CAO foncé (Michael 23 sept.)
const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 5000);
const ren = new THREE.WebGLRenderer({antialias:true}); ren.setPixelRatio(devicePixelRatio); ren.setSize(innerWidth, innerHeight);
document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(30, 60, 40); scene.add(sun);
const R = 0.66; // rayon 1 1/4 (Ø ext 1.66)
const COL = {nipple:0x8f98a8, coupe:0xdfe6f0, 'PAS EN STOCK':0xff5252, 'NÉGATIF':0xff5252};   // clair sur fond foncé
const box = new THREE.Box3();
function v(a){ return new THREE.Vector3(a[0], a[1], a[2]); }
function cyl(a, b, r, color){
  const A = v(a), B = v(b), L = A.distanceTo(B); if (L < 1e-6) return;
  const g = new THREE.CylinderGeometry(r, r, L, 24); const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color, roughness:.6}));
  m.position.copy(A).add(B).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), B.clone().sub(A).normalize());
  scene.add(m); box.expandByPoint(A); box.expandByPoint(B);
}
for (const s of D.segs){
  if (s.type==='pipe') cyl(s.a, s.b, R, COL[s.cls] ?? 0x202020);
  else if (s.type==='valve') cyl(s.a, s.b, R*1.7, 0xf0c030);
  else if (s.type==='union') cyl(s.a, s.b, R*1.5, 0x4a90e2);
  else if (s.type==='te'){ const m = new THREE.Mesh(new THREE.SphereGeometry(R*1.5, 20, 20), new THREE.MeshStandardMaterial({color:0x1a9a3a})); m.position.copy(v(s.a)); scene.add(m); cyl(s.a, s.b, R, 0x1a9a3a); }
  else if (s.type==='elbow'){ const m = new THREE.Mesh(new THREE.SphereGeometry(R*1.45, 20, 20), new THREE.MeshStandardMaterial({color:0x0b4f9c})); m.position.copy(v(s.a)); scene.add(m); }
}
// Michael 22 sept. : « je ne vois pas le tuyau, il est caché par ton écriture » → étiquette DÉCALÉE à côté du tuyau
// (perpendiculaire au tronçon) + ligne de rappel fine jusqu'au tuyau.
// Michael 23 sept. : rappel en BAÏONNETTE — diagonale depuis le tuyau, puis horizontale, bulle au bout, déportée
// sur le côté pour laisser la place à la tuyauterie. UP = perpendiculaire « haut » du tronçon, LAT = latéral horizontal.
const UP  = {d:[1,0,0], u:[1,0,0], r:[0,1,0], l:[0,1,0], f:[0,1,0], b:[0,1,0]};
const LAT = {d:[0,0,1], u:[0,0,1], r:[0,0,1], l:[0,0,1], f:[1,0,0], b:[1,0,0]};
let alt = 0;
function baionnette(p, d, k, color){
  const up = UP[d] || [0,1,0], lat = LAT[d] || [1,0,0];
  const side = (alt++ % 2 === 0) ? 1 : -1;               // un coup d'un bord, un coup de l'autre
  const B = [p[0] + (up[0]*8 + lat[0]*6*side)*k, p[1] + (up[1]*8 + lat[1]*6*side)*k, p[2] + (up[2]*8 + lat[2]*6*side)*k];
  const L = [B[0] + lat[0]*9*side, B[1] + lat[1]*9*side, B[2] + lat[2]*9*side];
  const g = new THREE.BufferGeometry().setFromPoints([v(p), v(B), v(L)]);
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({color})));
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshBasicMaterial({color})); dot.position.copy(v(p)); scene.add(dot);
  return [L[0] + lat[0]*4*side, L[1] + lat[1]*4*side, L[2] + lat[2]*4*side];
}
function sprite(text, sub, p, color, big){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  x.fillStyle = 'rgba(255,255,255,.85)'; x.roundRect(8, 8, 496, 240, 40); x.fill();
  x.strokeStyle = color; x.lineWidth = 10; x.roundRect(8, 8, 496, 240, 40); x.stroke();
  x.fillStyle = color; x.textAlign = 'center'; x.font = 'bold 150px sans-serif'; x.fillText(text, 256, sub ? 140 : 180);
  if (sub){ x.font = 'bold 78px sans-serif'; x.fillStyle = '#111'; x.fillText(sub, 256, 230); }
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), depthTest:false}));
  const k = big ? 3.6 : 2.4; s.scale.set(k*2, k, 1); s.position.copy(v(p)); s.renderOrder = 10; scene.add(s);
}
for (const l of D.labels){
  if (l.kind==='pipe'){ const c = l.cls==='nipple'?'#555':(l.cls==='coupe'?'#000':'#c00');
    const q = baionnette(l.p, l.d, 1.0, 0xc8d0dc); sprite(l.t, l.sub, q, c, true); }
  else if (l.kind==='valve'){ const q = baionnette(l.p, l.d, -0.7, 0xf0c030); sprite('V', '', q, '#b8860b', false); }
  else if (l.kind==='union'){ const q = baionnette(l.p, l.d, -0.7, 0x4a90e2); sprite('U', '', q, '#2a6fc0', false); }
  else if (l.kind==='te') sprite('drip', '', [l.p[0], l.p[1]-2.5, l.p[2]], '#1a9a3a', false);
  else sprite(l.t, '', [l.p[0]+3, l.p[1]+3, l.p[2]], '#7fb3ff', false);
}
const ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length() || 20;
cam.position.set(ctr.x + size*1.5, ctr.y + size*0.7, ctr.z + size*0.9); cam.lookAt(ctr);   // vue 3/4 : aucun tronçon dans l'axe de l'œil
const ctl = new OrbitControls(cam, ren.domElement); ctl.target.copy(ctr); ctl.enableDamping = true;
addEventListener('resize', ()=>{ cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
document.getElementById('secours').remove();      // la 3D a démarré : on enlève l'image de secours
(function loop(){ ctl.update(); ren.render(scene, cam); requestAnimationFrame(loop); })();
</script>
