<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="manifest" href="/c/manifest.json"><link rel="apple-touch-icon" href="/c/icone.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1c2230">
<style>
 html,body{margin:0;height:100%;background:#1c2230;color:#eef;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:manipulation}
 #app{display:flex;flex-direction:column;height:100%}
 #haut{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#2b3648,#1a2230);border-bottom:1px solid #3a4658}
 #haut h1{font-size:16px;margin:0;flex:1}
 canvas{display:block;width:100%;flex:1;min-height:0;touch-action:none}
 #panneau{background:#151b26;border-top:1px solid #3a4658;padding:10px 10px 14px;box-shadow:0 -6px 12px rgba(0,0,0,.35)}
 #q{font-size:15px;font-weight:700;color:#ffd34d;margin:0 0 6px}
 #chemin{font-size:13px;color:#9fd0ff;margin:0 0 8px;line-height:1.35;max-height:52px;overflow:auto}
 .grille{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
 .btn{border:0;border-radius:10px;padding:9px 5px;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);cursor:pointer;
   background:linear-gradient(180deg,#5b8ad8 0%,#2f61b8 48%,#244f9f 52%,#3a74d6 100%);box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55)}
 .btn.vert{background:linear-gradient(180deg,#7ee38a 0%,#2eaa48 48%,#22903a 52%,#4cc665 100%)}
 .btn.or{background:linear-gradient(180deg,#ffd34d 0%,#f39c12 48%,#d9820a 52%,#ffb42e 100%);color:#2a1b00;text-shadow:none}
 .btn.gris{background:linear-gradient(180deg,#5a6272,#3a4150 48%,#30363f 52%,#454c58)}
 .btn.rouge{background:linear-gradient(180deg,#ff8a80 0%,#e53935 48%,#c62828 52%,#ff5252 100%)}
 .btn.large{grid-column:span 3}
 .petit{font-size:12px;font-weight:400;display:block;opacity:.85}
 #annuler{font-size:13px;padding:8px 10px}
 #msg{font-size:12px;color:#8a93a3;margin-top:6px;min-height:14px}
 .aff{grid-column:span 3;font-size:26px;font-weight:800;color:#7ee38a;text-align:center;padding:4px 0}
 .pad{grid-column:span 3;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
 .frac{grid-column:span 3;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
 .cote{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .btn.k{padding:8px 4px;font-size:15px}
 .btn.sel{background:linear-gradient(180deg,#ffd34d 0%,#f39c12 48%,#d9820a 52%,#ffb42e 100%);color:#2a1b00;text-shadow:none}
 #panneau{max-height:52vh;overflow:auto}
</style></head><body>
<div id="app">
 <div id="haut"><a class="btn gris" id="retour" href="/c/dernier.html" style="text-decoration:none;font-size:12px;padding:8px 10px">← sections</a><h1 id="titre">Section</h1><button class="btn gris" id="annuler">↶ Effacer</button></div>
 <canvas id="cv"></canvas>
 <div id="panneau"><p id="q"></p><p id="chemin"></p><div class="grille" id="btns"></div><div id="msg"></div></div>
</div>
<script>
// ---------- repère : face au tap, le main dans le dos ----------
const V3 = {r:[1,0,0], l:[-1,0,0], f:[0,1,0], b:[0,-1,0], u:[0,0,1], d:[0,0,-1]};
const MOT = {u:'je monte', d:'je descends', r:'vers la droite', l:'vers la gauche', f:'vers l\'arrière', b:'tout droit'};
const MOT45 = {u:'en montant', d:'en descendant', r:'vers la droite', l:'vers la gauche', f:'vers l\'arrière', b:'tout droit'};
const OPP = {u:'d', d:'u', r:'l', l:'r', f:'b', b:'f'};
const DEPARTS = {tap:'Tap', coude:'Coude', te:'Té', bague:'Bague'};
const FINS = {bout:'Bout (tuyau nu)', coude:'Coude', te:'Té', bague:'Bague'};
const MARQ = {valve:'Valve', union:'Union', te:'Té (purge)'};

const params = new URLSearchParams(location.search);
const slot = params.get('slot') || '1';
let nom = params.get('nom') || ('Section ' + slot);
document.getElementById('titre').textContent = nom;

// ---------- état ----------
let etat = {depart:null, legs:[], fini:false, mes:{}, qi:0, retour:false};   // leg = {sens:[...], marqueurs:[], fin:null|'90'|'45'|'fin:xxx'}
let etape = 'depart';                              // depart | sens | sens45 | bout | fin | termine
let attente = null;                                // pour le 45 : première composante choisie
let departEnvoye = false;
const hist = [];

function dirLeg(l){ const v=[0,0,0]; for(const s of l.sens){ v[0]+=V3[s][0]; v[1]+=V3[s][1]; v[2]+=V3[s][2]; } return v; }
function legCourante(){ return etat.legs[etat.legs.length-1]; }
function phrase(){
  if(!etat.depart) return '';
  const p=[DEPARTS[etat.depart]];
  for(const l of etat.legs){
    if(l.sens.length===2) p.push(MOT45[l.sens[0]]+' '+MOT45[l.sens[1]]); else p.push(MOT[l.sens[0]]);
    for(const m of l.marqueurs) p.push(MARQ[m].toLowerCase());
    if(l.fin==='90') p.push('90'); else if(l.fin==='45') p.push('45'); else if(l.fin==='te90') p.push('té, ça tourne'); else if(l.fin&&l.fin.startsWith('fin:')) p.push('fin : '+FINS[l.fin.slice(4)].toLowerCase());
  }
  return p.join(', ');
}

// ---------- dessin iso ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function resize(){ const r=cv.getBoundingClientRect(); cv.width=r.width*devicePixelRatio; cv.height=r.height*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); dessiner(); }
// ---------- dessin 3D qu'on tourne au doigt (Michael 24 sept. : « en 2D c'est dur, mauvaise perception spatiale ») ----------
let yaw=-0.62, pitch=0.42, drag=null;                    // vue de départ : trois-quarts, comme l'iso d'avant
function p3(){ const P=[[0,0,0]]; etat.legs.forEach((l,i)=>{ const u=vecU(l.sens); const q=P[P.length-1]; const Li=1+0.35*(i%4); P.push([q[0]+u[0]*Li, q[1]+u[1]*Li, q[2]+u[2]*Li]); }); return P; }
function rot(p){ const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const x1=p[0]*cy-p[1]*sy, y1=p[0]*sy+p[1]*cy; const z2=y1*sp+p[2]*cp; return [x1, -z2]; }
function dessiner(){
  const W=cv.getBoundingClientRect().width, H=cv.getBoundingClientRect().height;
  ctx.clearRect(0,0,W,H);
  if(!etat.depart){ ctx.fillStyle='#8a93a3'; ctx.font='15px sans-serif'; ctx.textAlign='center'; ctx.fillText('Le chemin se dessine ici, en 3D : tourne-le au doigt', W/2, H/2); return; }
  const P3=p3(); const R=P3.map(rot);
  // sol : grille sous le point le plus bas, tournée avec le reste
  const zmin=Math.min(...P3.map(p=>p[2]))-0.3, xs=P3.map(p=>p[0]), ys=P3.map(p=>p[1]);
  const gx0=Math.floor(Math.min(...xs))-1, gx1=Math.ceil(Math.max(...xs))+1, gy0=Math.floor(Math.min(...ys))-1, gy1=Math.ceil(Math.max(...ys))+1;
  const G=[]; for(let x=gx0;x<=gx1;x++) G.push([rot([x,gy0,zmin]),rot([x,gy1,zmin])]); for(let y=gy0;y<=gy1;y++) G.push([rot([gx0,y,zmin]),rot([gx1,y,zmin])]);
  // triade au départ
  const T=[[rot([0.55,0,0]),'droite'],[rot([0,-0.55,0]),'tout droit'],[rot([0,0,0.55]),'haut']];
  const all=R.concat(G.flat()); let minx=Math.min(...all.map(p=>p[0])), maxx=Math.max(...all.map(p=>p[0])), miny=Math.min(...all.map(p=>p[1])), maxy=Math.max(...all.map(p=>p[1]));
  const sc=Math.min((W-70)/Math.max(maxx-minx,0.5),(H-70)/Math.max(maxy-miny,0.5)); const ox=W/2-(minx+maxx)/2*sc, oy=H/2-(miny+maxy)/2*sc;
  const S=p=>[p[0]*sc+ox, p[1]*sc+oy]; const P=R.map(S);
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1; for(const [a,b] of G){ const A=S(a),B=S(b); ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke(); }
  const p0=P[0]; for(const [v,lab] of T){ const V=S(v); ctx.strokeStyle='rgba(159,208,255,.55)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(V[0],V[1]); ctx.stroke(); ctx.fillStyle='rgba(159,208,255,.8)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(lab, V[0], V[1]-4); }
  ctx.lineCap='round'; ctx.lineJoin='round';
  etat.legs.forEach((l,i)=>{ const a=P[i], b=P[i+1];
    const Qc=(etape==='mesures')?questions()[etat.qi]:null; ctx.strokeStyle=(Qc&&Qc.leg===i)?'#ffd34d':'#dfe6f0'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    l.marqueurs.forEach((m,k)=>{ const t=(k+1)/(l.marqueurs.length+1); const x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t;
      ctx.fillStyle = m==='valve'?'#f39c12':(m==='union'?'#2f61b8':'#1a9a3a'); ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill();
      if(m==='te'){ const D=S(rot([P3[i][0],P3[i][1],P3[i][2]-0.35])); const O=S(rot(P3[i])); ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+(D[0]-O[0]),y+(D[1]-O[1])); ctx.stroke(); }
      ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText(m==='valve'?'V':(m==='union'?'U':'T'), x, y+4); });
    if(l.fin==='te90'){ const ux=(b[0]-a[0])/(Math.hypot(b[0]-a[0],b[1]-a[1])||1), uy=(b[1]-a[1])/(Math.hypot(b[0]-a[0],b[1]-a[1])||1);
      ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(b[0],b[1]); ctx.lineTo(b[0]+ux*24,b[1]+uy*24); ctx.stroke();
      ctx.fillStyle='#1a9a3a'; ctx.beginPath(); ctx.arc(b[0],b[1],10,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText('T', b[0], b[1]+4); }
    else if(l.fin==='90'||l.fin==='45'){ ctx.fillStyle='#0b4f9c'; ctx.beginPath(); ctx.arc(b[0],b[1],9,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText(l.fin, b[0], b[1]+4); }
    else if(l.fin&&l.fin.startsWith('fin:')){ const t=l.fin.slice(4); ctx.fillStyle = t==='te'?'#1a9a3a':'#ffd34d'; ctx.beginPath(); ctx.arc(b[0],b[1],11,0,7); ctx.fill();
      if(t==='te'){ const D=S(rot([P3[i+1][0],P3[i+1][1],P3[i+1][2]-0.4])); ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(b[0],b[1]); ctx.lineTo(D[0],D[1]); ctx.stroke(); }
      ctx.fillStyle='#ffd34d'; ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.fillText('FIN '+FINS[t].split(' ')[0].toUpperCase(), b[0]+14, b[1]-14); }
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, vx=b[0]-a[0], vy=b[1]-a[1], vn=Math.hypot(vx,vy)||1;
    const nx=mx-vy/vn*17, ny=my+vx/vn*17; ctx.fillStyle='#ffd34d'; ctx.beginPath(); ctx.arc(nx,ny,11,0,7); ctx.fill();
    ctx.fillStyle='#2a1b00'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText(String(i+1), nx, ny+5);
  });
  ctx.fillStyle='#ffd34d'; ctx.beginPath(); ctx.arc(p0[0],p0[1],10,0,7); ctx.fill();
  ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.fillText(DEPARTS[etat.depart].toUpperCase(), p0[0]+14, p0[1]+5);
  if(!etat.fini){ const q=P[P.length-1]; ctx.strokeStyle='#ffd34d'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(q[0],q[1],16,0,7); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle='rgba(138,147,163,.7)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText('tourne au doigt · double-tape = vue de départ', W-8, H-8);
}
cv.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,yaw,pitch}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{ if(!drag) return; yaw=drag.yaw+(e.clientX-drag.x)*0.012; pitch=Math.max(-1.4,Math.min(1.4,drag.pitch+(e.clientY-drag.y)*0.012)); dessiner(); });
cv.addEventListener('pointerup', ()=>{ drag=null; }); cv.addEventListener('pointercancel', ()=>{ drag=null; });
cv.addEventListener('dblclick', ()=>{ yaw=-0.62; pitch=0.42; dessiner(); });

// ---------- panneau de questions ----------
function btn(txt, cls, fn, sous){ const b=document.createElement('button'); b.className='btn '+(cls||''); b.innerHTML=txt+(sous?'<span class="petit">'+sous+'</span>':''); b.onclick=()=>{ const snap=JSON.stringify({etat,etape,attente}); if(fn()===false) return; hist.push(snap); rendre(); }; return b; }
function sensPermis(){
  const l=legCourante(); if(!l) return ['u','d','r','l','f','b'];
  const prev = etat.legs.length>=1 && l.fin ? l : null;      // on est après un 90/45 : l est le tronçon précédent
  if(!prev) return ['u','d','r','l','f','b'];
  const s=prev.sens;
  if(prev.fin==='90'||prev.fin==='te90'){ if(s.length===1) return ['u','d','r','l','f','b'].filter(k=>k!==s[0]&&k!==OPP[s[0]]); return ['u','d','r','l','f','b'].filter(k=>!s.includes(k)&&!s.map(x=>OPP[x]).includes(k)); }
  if(prev.fin==='45'){ if(s.length===1) return ['u','d','r','l','f','b'].filter(k=>k!==s[0]&&k!==OPP[s[0]]); return s.slice(); }
  return ['u','d','r','l','f','b'];
}
function rendre(){
  const q=document.getElementById('q'), B=document.getElementById('btns'); B.innerHTML='';
  document.getElementById('chemin').textContent = phrase();
  if(etape==='depart'){ q.textContent='1. Ça part de quoi ?';
    for(const k in DEPARTS) B.appendChild(btn(DEPARTS[k], 'or', ()=>{ etat.depart=k; etape='sens'; envoyerDepart(); })); }
  else if(etape==='sens'){ const l=legCourante(); q.textContent=(etat.legs.length&&l&&!l.fin?'':(etat.legs.length+1)+'. ')+'Dans quel sens ?';
    const ok=sensPermis(); const prev=l&&l.fin?l:null;
    for(const k of ['u','d','r','l','f','b']){ const b=btn(MOT[k], ok.includes(k)?'':'gris', ()=>{ if(!ok.includes(k)) return false;
        if(prev&&prev.fin==='45'){ // 45 : composer avec le sens précédent (axe → diagonale, diagonale → axe)
          const ns = prev.sens.length===1 ? [prev.sens[0], k] : [k];
          etat.legs.push({sens:ns, marqueurs:[], fin:null}); etape='bout'; }
        else { etat.legs.push({sens:[k], marqueurs:[], fin:null}); etape='bout'; } }); B.appendChild(b); }
    if(!prev || prev.fin==='90' || prev.fin==='te90'){ B.appendChild(btn('En 45 ↗', 'gris large', ()=>{ etape='sens45'; attente=null; }, 'deux sens combinés')); }
  }
  else if(etape==='sens45'){ q.textContent = attente ? 'Le 45 : '+MOT45[attente]+' … et ?' : 'Le 45 : premier sens ?';
    const ok = attente ? ['u','d','r','l','f','b'].filter(k=>k!==attente&&k!==OPP[attente]) : sensPermis();
    for(const k of ['u','d','r','l','f','b']) B.appendChild(btn(MOT45[k], ok.includes(k)?'':'gris', ()=>{ if(!ok.includes(k)) return false;
      if(!attente){ attente=k; } else { etat.legs.push({sens:[attente,k], marqueurs:[], fin:null}); attente=null; etape='bout'; } })); }
  else if(etape==='bout'){ q.textContent='Au bout de ce tronçon, il y a quoi ?';
    B.appendChild(btn('Té, ça TOURNE', 'vert', ()=>{ legCourante().fin='te90'; etape='sens'; }, 'le chemin prend la branche'));
    B.appendChild(btn('Té en ligne', 'vert', ()=>{ legCourante().marqueurs.push('te'); }, 'purge sur le côté, ça continue'));
    B.appendChild(btn('90', '', ()=>{ legCourante().fin='90'; etape='sens'; }));
    B.appendChild(btn('45', '', ()=>{ legCourante().fin='45'; etape='sens'; }));
    B.appendChild(btn('Valve', 'or', ()=>{ legCourante().marqueurs.push('valve'); }, 'en ligne, ça continue'));
    B.appendChild(btn('Union', '', ()=>{ legCourante().marqueurs.push('union'); }, 'en ligne, ça continue'));
    B.appendChild(btn('C\'est la FIN', 'rouge', ()=>{ etape='fin'; })); }
  else if(etape==='fin'){ q.textContent='La fin, c\'est quoi ?';
    for(const k in FINS) B.appendChild(btn(FINS[k], k==='te'?'vert':'or', ()=>{ legCourante().fin='fin:'+k; etat.fini=true; etape='termine'; })); }
  else if(etape==='termine'){ q.textContent='Chemin complet. Maintenant les cotes au galon, une par écran.';
    B.appendChild(btn('Mesures ➤', 'vert large', ()=>{ etat.qi=0; etat.retour=false; etape='mesures'; }, 'je te demande seulement ce qu\'il faut pour CE chemin')); }
  else if(etape==='mesures'){ rendreMesure(q, B); }
  else if(etape==='relire'){ rendreRelecture(q, B); }
  dessiner();
}
document.getElementById('annuler').onclick=()=>{ const h=hist.pop(); if(!h) return; const o=JSON.parse(h); etat=o.etat; etape=o.etape; attente=o.attente; rendre(); };

// ---------- mesures : ce que CE chemin exige (même logique que ~/bin/chemin_auto.py) ----------
function vecU(sens){ const v=[0,0,0]; for(const s of sens){ v[0]+=V3[s][0]; v[1]+=V3[s][1]; v[2]+=V3[s][2]; } const n=Math.hypot(...v)||1; return v.map(x=>x/n); }
function rang(cols){ const m=cols.map(c=>c.slice()); let r=0; for(let k=0;k<3;k++){ let piv=-1; for(let i=r;i<m.length;i++){ if(Math.abs(m[i][k])>1e-9){piv=i;break;} } if(piv<0) continue;
  [m[r],m[piv]]=[m[piv],m[r]]; for(let i=0;i<m.length;i++){ if(i!==r&&Math.abs(m[i][k])>1e-9){ const f=m[i][k]/m[r][k]; m[i]=m[i].map((a,j)=>a-f*m[r][j]); } } r++; } return r; }
function questions(){
  const U=etat.legs.map(l=>vecU(l.sens)); const Q=[];
  const axes=[0,1,2].filter(k=>U.some(u=>Math.abs(u[k])>1e-9));
  const dep=DEPARTS[etat.depart]||'départ'; const finL=etat.legs[etat.legs.length-1]; const finT=finL&&finL.fin&&finL.fin.startsWith('fin:')?finL.fin.slice(4):'bout';
  const ptA = etat.depart==='tap'||etat.depart==='bague' ? 'face du '+dep.toLowerCase() : 'centre du '+dep.toLowerCase();
  const ptB = finT==='bout' ? 'bout du tuyau d\'arrivée' : (finT==='bague' ? 'face de la bague' : 'centre du '+FINS[finT].toLowerCase());
  if(axes.includes(2)){ Q.push({id:'plafA', titre:'Plafond → '+ptA, sous:'au galon, à la verticale', leg:0});
                        Q.push({id:'plafB', titre:'Plafond → '+ptB, sous:'même plafond, à la verticale', leg:etat.legs.length-1}); }
  if(axes.includes(0)) Q.push({id:'dx', titre:'Écart droite-gauche', sous:'arrivée → ligne laser verticale, lecture la plus courte', cote:[['r','arrivée à DROITE'],['l','arrivée à GAUCHE']]});
  if(axes.includes(1)) Q.push({id:'dy', titre:'Écart devant-derrière', sous:'du départ à l\'arrivée, le long de la ligne', cote:[['f','arrivée DEVANT'],['b','arrivée DERRIÈRE']]});
  const libres=[]; for(let k=U.length-1;k>=0;k--){ const autres=U.filter((u,i)=>i!==k&&!libres.includes(i)); if(rang(autres.concat([U[k]]))===rang(autres)) libres.push(k); }   // du bout vers le tap : jamais le premier vertical si on peut l'éviter
  for(const k of libres.slice().reverse()) Q.push({id:'L'+k, titre:'Longueur du tronçon '+(k+1), sous:'il peut glisser sans changer l\'arrivée : mesure-le (jaune sur le dessin)', leg:k});
  etat.legs.forEach((l,i)=>{ l.marqueurs.forEach((m,k)=>{ const nomM={te:'Té',valve:'Valve',union:'Union'}[m]; Q.push({id:'M'+i+'_'+k, m, titre:nomM+' du tronçon '+(i+1)+' : à combien du raccord d\'avant ?', sous:(m==='te'?'centre du té':'face avant')+' depuis le début du tronçon · Passer = je la place moi-même', leg:i, opt:true}); }); });
  Q.push({id:'diag', titre:'Contrôle : diagonale départ → arrivée', sous:'au sol ou en direct ; facultatif mais ça attrape une erreur', opt:true});
  return Q;
}
let cur={po:'', f:0, c:null};
function fmt16(v){ if(v==null) return '—'; const po=Math.floor(v/16), f=v%16; const g=(a,b)=>b?g(b,a%b):a; const d=g(f,16); return (po?po:'')+(f?(po?' ':'')+(f/d)+'/'+(16/d):'')+' po'; }
function valCur(){ return (parseInt(cur.po||'0',10)*16)+cur.f; }
function rendreMesure(q, B){
  const Q=questions(); if(etat.qi>=Q.length){ etape='relire'; rendreRelecture(q,B); return; }
  const Qc=Q[etat.qi]; q.innerHTML=(etat.qi+1)+'/'+Q.length+' · '+Qc.titre+'<span class="petit">'+Qc.sous+'</span>';
  const aff=document.createElement('div'); aff.className='aff'; aff.textContent=(cur.po||'0')+(cur.f?' '+fmt16(cur.f).replace(' po',''):'')+' po'+(Qc.cote&&cur.c?' · '+Qc.cote.find(x=>x[0]===cur.c)[1]:''); B.appendChild(aff);
  const pad=document.createElement('div'); pad.className='pad';
  for(const d of ['7','8','9','4','5','6','1','2','3','⌫','0','C']){ const b=document.createElement('button'); b.className='btn k'; b.textContent=d;
    b.onclick=()=>{ if(d==='⌫') cur.po=cur.po.slice(0,-1); else if(d==='C'){cur.po='';cur.f=0;} else if(cur.po.length<3) cur.po+=d; rendre(); }; pad.appendChild(b); }
  B.appendChild(pad);
  const fr=document.createElement('div'); fr.className='frac';
  for(let n=0;n<16;n++){ const b=document.createElement('button'); b.className='btn k'+(cur.f===n?' sel':''); b.textContent=n?fmt16(n).replace(' po',''):'0'; b.onclick=()=>{ cur.f=n; rendre(); }; fr.appendChild(b); }
  B.appendChild(fr);
  if(Qc.cote){ const cd=document.createElement('div'); cd.className='cote'; for(const [k,lab] of Qc.cote){ const b=document.createElement('button'); b.className='btn '+(cur.c===k?'or':'gris'); b.textContent=lab; b.onclick=()=>{ cur.c=k; rendre(); }; cd.appendChild(b); } B.appendChild(cd); }
  const ok=btn('OK ✔', 'vert large', ()=>{ const v=valCur(); if(!Qc.opt && v<=0) return false; if(Qc.cote && !cur.c) return false;
    if(Qc.id==='dx'||Qc.id==='dy') etat.mes[Qc.id]={v, c:cur.c}; else if(Qc.id.startsWith('L')) (etat.mes.longs=etat.mes.longs||{})[Qc.id.slice(1)]=v;
    else if(Qc.id.startsWith('M')){ const [i,k]=Qc.id.slice(1).split('_'); const P=(etat.mes.pos=etat.mes.pos||{}); (P[i]=P[i]||{})[k]=v||null; } else etat.mes[Qc.id]=v||null;
    cur={po:'',f:0,c:null}; if(etat.retour){ etat.retour=false; etape='relire'; } else etat.qi++; });
  B.appendChild(ok);
  if(Qc.opt){ B.appendChild(btn('Passer', 'gris large', ()=>{ if(Qc.id.startsWith('M')){ const [i,k]=Qc.id.slice(1).split('_'); const P=(etat.mes.pos=etat.mes.pos||{}); (P[i]=P[i]||{})[k]=null; } else etat.mes[Qc.id]=null; cur={po:'',f:0,c:null}; if(etat.retour){etat.retour=false; etape='relire';} else etat.qi++; })); }
}
function valeurDe(Qc){ const m=etat.mes; if(Qc.id==='dx'||Qc.id==='dy'){ const e=m[Qc.id]; return e?fmt16(e.v)+' · '+Qc.cote.find(x=>x[0]===e.c)[1]:'—'; }
  if(Qc.id.startsWith('L')) return fmt16((m.longs||{})[Qc.id.slice(1)]); if(Qc.id.startsWith('M')){ const [i,k]=Qc.id.slice(1).split('_'); const v=((m.pos||{})[i]||{})[k]; return v==null?'placée par Claude':fmt16(v); } return m[Qc.id]==null?(Qc.opt?'passé':'—'):fmt16(m[Qc.id]); }
function rendreRelecture(q, B){
  const Q=questions(); q.textContent='Relis. Touche une ligne pour la refaire.';
  Q.forEach((Qc,i)=>{ const b=btn(Qc.titre.replace(/^Contrôle : /,'Contrôle '), 'large gris', ()=>{ etat.qi=i; etat.retour=true; etape='mesures'; }, valeurDe(Qc)); b.style.textAlign='left'; B.appendChild(b); });
  B.appendChild(btn('Envoyer à Claude ➤', 'vert large', envoyer, 'je calcule et je te dis les coupes'));
}

// ---------- réseau ----------
const API = (location.hostname.endsWith('ts.net')||location.hostname==='127.0.0.1') ? '' : 'https://michael-system-product-name.tail362e86.ts.net';
async function post(url, body){ const ctl=new AbortController(); setTimeout(()=>ctl.abort(), 8000);
  const r=await fetch(API+url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),signal:ctl.signal}); return r.json(); }
async function envoyerDepart(){ if(departEnvoye) return; departEnvoye=true;   // le chrono part au PREMIER geste de la section
  try{ const j=await post('/c/api/depart', {slot, nom}); document.getElementById('msg').textContent=j.message||''; }catch(e){ document.getElementById('msg').textContent='PC injoignable pour le chrono (pas grave, continue).'; } }
async function envoyer(){ try{ const j=await post('/c/api/chemin', {slot, nom, depart:etat.depart, legs:etat.legs, mesures:etat.mes, phrase:phrase(), ts:Date.now()});
    document.getElementById('msg').textContent=j.message||'envoyé'; document.getElementById('q').textContent=j.message||'Envoyé.'; document.getElementById('btns').innerHTML=''; }catch(e){ document.getElementById('msg').textContent='PC injoignable : dis le chemin à Claude au casque : '+phrase(); } }
addEventListener('resize', resize); resize(); rendre();
