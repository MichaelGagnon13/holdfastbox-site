<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chemin — section</title>
<link rel="manifest" href="/c/manifest.json"><link rel="apple-touch-icon" href="/c/icone.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1c2230">
<style>
 html,body{margin:0;height:100%;background:#1c2230;color:#eef;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:manipulation}
 #app{display:flex;flex-direction:column;height:100%}
 #haut{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#2b3648,#1a2230);border-bottom:1px solid #3a4658}
 #haut h1{font-size:16px;margin:0;flex:1}
 canvas{display:block;width:100%;flex:1;min-height:0}
 #panneau{background:#151b26;border-top:1px solid #3a4658;padding:10px 10px 14px;box-shadow:0 -6px 12px rgba(0,0,0,.35)}
 #q{font-size:17px;font-weight:700;color:#ffd34d;margin:0 0 8px}
 #chemin{font-size:13px;color:#9fd0ff;margin:0 0 8px;line-height:1.35;max-height:52px;overflow:auto}
 .grille{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .btn{border:0;border-radius:12px;padding:13px 6px;font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);cursor:pointer;
   background:linear-gradient(180deg,#5b8ad8 0%,#2f61b8 48%,#244f9f 52%,#3a74d6 100%);box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55)}
 .btn.vert{background:linear-gradient(180deg,#7ee38a 0%,#2eaa48 48%,#22903a 52%,#4cc665 100%)}
 .btn.or{background:linear-gradient(180deg,#ffd34d 0%,#f39c12 48%,#d9820a 52%,#ffb42e 100%);color:#2a1b00;text-shadow:none}
 .btn.gris{background:linear-gradient(180deg,#5a6272,#3a4150 48%,#30363f 52%,#454c58)}
 .btn.rouge{background:linear-gradient(180deg,#ff8a80 0%,#e53935 48%,#c62828 52%,#ff5252 100%)}
 .btn.large{grid-column:span 3}
 .petit{font-size:12px;font-weight:400;display:block;opacity:.85}
 #annuler{font-size:13px;padding:8px 10px}
 #msg{font-size:12px;color:#8a93a3;margin-top:6px;min-height:14px}
</style></head><body>
<div id="app">
 <div id="haut"><a class="btn gris" id="retour" href="/c/dernier.html" style="text-decoration:none;font-size:12px;padding:8px 10px">← sections</a><h1 id="titre">Section</h1><button class="btn gris" id="annuler">↶ Annuler</button></div>
 <canvas id="cv"></canvas>
 <div id="panneau"><p id="q"></p><p id="chemin"></p><div class="grille" id="btns"></div><div id="msg"></div></div>
</div>
<script>
// ---------- repère : face au tap, le main dans le dos ----------
const V3 = {r:[1,0,0], l:[-1,0,0], f:[0,1,0], b:[0,-1,0], u:[0,0,1], d:[0,0,-1]};
const ISO = {r:[0.866,0.5], l:[-0.866,-0.5], f:[-0.866,0.5], b:[0.866,-0.5], u:[0,-1], d:[0,1]};
const MOT = {u:'je monte', d:'je descends', r:'vers la droite', l:'vers la gauche', f:'vers moi', b:'vers le main'};
const MOT45 = {u:'en montant', d:'en descendant', r:'vers la droite', l:'vers la gauche', f:'vers moi', b:'vers le main'};
const OPP = {u:'d', d:'u', r:'l', l:'r', f:'b', b:'f'};
const DEPARTS = {tap:'Tap', coude:'Coude', te:'Té', bague:'Bague'};
const FINS = {bout:'Bout (tuyau nu)', coude:'Coude', te:'Té', bague:'Bague'};
const MARQ = {valve:'Valve', union:'Union', te:'Té (purge)'};

const params = new URLSearchParams(location.search);
const slot = params.get('slot') || '1';
let nom = params.get('nom') || ('Section ' + slot);
document.getElementById('titre').textContent = nom;

// ---------- état ----------
let etat = {depart:null, legs:[], fini:false};   // leg = {sens:[...], marqueurs:[], fin:null|'90'|'45'|'fin:xxx'}
let etape = 'depart';                              // depart | sens | sens45 | bout | fin | termine
let attente = null;                                // pour le 45 : première composante choisie
let departEnvoye = false;
const hist = [];

function dirLeg(l){ const v=[0,0,0]; for(const s of l.sens){ v[0]+=V3[s][0]; v[1]+=V3[s][1]; v[2]+=V3[s][2]; } return v; }
function legCourante(){ return etat.legs[etat.legs.length-1]; }
function phrase(){
  if(!etat.depart) return '';
  const p=[DEPARTS[etat.depart]];
  for(const l of etat.legs){
    if(l.sens.length===2) p.push(MOT45[l.sens[0]]+' '+MOT45[l.sens[1]]); else p.push(MOT[l.sens[0]]);
    for(const m of l.marqueurs) p.push(MARQ[m].toLowerCase());
    if(l.fin==='90') p.push('90'); else if(l.fin==='45') p.push('45'); else if(l.fin&&l.fin.startsWith('fin:')) p.push('fin : '+FINS[l.fin.slice(4)].toLowerCase());
  }
  return p.join(', ');
}

// ---------- dessin iso ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function resize(){ const r=cv.getBoundingClientRect(); cv.width=r.width*devicePixelRatio; cv.height=r.height*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); dessiner(); }
function proj(l){ const s=l.sens; let x=0,y=0; for(const k of s){ x+=ISO[k][0]; y+=ISO[k][1]; } const n=Math.hypot(x,y)||1; return [x/n,y/n]; }
function dessiner(){
  const W=cv.getBoundingClientRect().width, H=cv.getBoundingClientRect().height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let x=-H;x<W*2;x+=36){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+H*0.577,H);ctx.stroke(); ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-H*0.577,H);ctx.stroke(); }
  if(!etat.depart){ ctx.fillStyle='#8a93a3'; ctx.font='15px sans-serif'; ctx.textAlign='center'; ctx.fillText('Le chemin se dessine ici, du départ vers la fin', W/2, H/2); return; }
  // calcul des points (longueur fixe par tronçon) puis recentrage
  const L=Math.min(110, Math.max(60, Math.min(W,H)/ (etat.legs.length+1.5)));
  const pts=[[0,0]]; etat.legs.forEach((l,i)=>{ const p=proj(l); const q=pts[pts.length-1]; const Li=L*(1+0.18*(i%3)); pts.push([q[0]+p[0]*Li, q[1]+p[1]*Li]); });
  let minx=Math.min(...pts.map(p=>p[0])), maxx=Math.max(...pts.map(p=>p[0])), miny=Math.min(...pts.map(p=>p[1])), maxy=Math.max(...pts.map(p=>p[1]));
  const ox=W/2-(minx+maxx)/2, oy=H/2-(miny+maxy)/2;
  const P=pts.map(p=>[p[0]+ox,p[1]+oy]);
  ctx.lineCap='round'; ctx.lineJoin='round';
  etat.legs.forEach((l,i)=>{ const a=P[i], b=P[i+1];
    ctx.strokeStyle='#dfe6f0'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    l.marqueurs.forEach((m,k)=>{ const t=(k+1)/(l.marqueurs.length+1); const x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t;
      ctx.fillStyle = m==='valve'?'#f39c12':(m==='union'?'#2f61b8':'#1a9a3a'); ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill();
      if(m==='te'){ ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+22); ctx.stroke(); }
      ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText(m==='valve'?'V':(m==='union'?'U':'T'), x, y+4); });
    // raccord au bout
    if(l.fin==='90'||l.fin==='45'){ ctx.fillStyle='#0b4f9c'; ctx.beginPath(); ctx.arc(b[0],b[1],9,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText(l.fin, b[0], b[1]+4); }
    else if(l.fin&&l.fin.startsWith('fin:')){ const t=l.fin.slice(4); ctx.fillStyle = t==='te'?'#1a9a3a':'#ffd34d'; ctx.beginPath(); ctx.arc(b[0],b[1],11,0,7); ctx.fill();
      if(t==='te'){ ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(b[0],b[1]); ctx.lineTo(b[0],b[1]+26); ctx.stroke(); }
      ctx.fillStyle='#ffd34d'; ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.fillText('FIN '+FINS[t].split(' ')[0].toUpperCase(), b[0]+14, b[1]-14); }
    // numéro du tronçon
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, vx=b[0]-a[0], vy=b[1]-a[1], vn=Math.hypot(vx,vy)||1;
    const nx=mx-vy/vn*17, ny=my+vx/vn*17; ctx.fillStyle='#ffd34d'; ctx.beginPath(); ctx.arc(nx,ny,11,0,7); ctx.fill();
    ctx.fillStyle='#2a1b00'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText(String(i+1), nx, ny+5);
  });
  // départ
  const p0=P[0]; ctx.fillStyle='#ffd34d'; ctx.beginPath(); ctx.arc(p0[0],p0[1],10,0,7); ctx.fill();
  ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.fillText(DEPARTS[etat.depart].toUpperCase(), p0[0]+14, p0[1]+5);
  // curseur : là où on en est
  if(!etat.fini){ const q=P[P.length-1]; ctx.strokeStyle='#ffd34d'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(q[0],q[1],16,0,7); ctx.stroke(); ctx.setLineDash([]); }
}

// ---------- panneau de questions ----------
function btn(txt, cls, fn, sous){ const b=document.createElement('button'); b.className='btn '+(cls||''); b.innerHTML=txt+(sous?'<span class="petit">'+sous+'</span>':''); b.onclick=()=>{ hist.push(JSON.stringify({etat,etape,attente})); fn(); rendre(); }; return b; }
function sensPermis(){
  const l=legCourante(); if(!l) return ['u','d','r','l','f','b'];
  const prev = etat.legs.length>=1 && l.fin ? l : null;      // on est après un 90/45 : l est le tronçon précédent
  if(!prev) return ['u','d','r','l','f','b'];
  const s=prev.sens;
  if(prev.fin==='90'){ if(s.length===1) return ['u','d','r','l','f','b'].filter(k=>k!==s[0]&&k!==OPP[s[0]]); return ['u','d','r','l','f','b'].filter(k=>!s.includes(k)&&!s.map(x=>OPP[x]).includes(k)); }
  if(prev.fin==='45'){ if(s.length===1) return ['u','d','r','l','f','b'].filter(k=>k!==s[0]&&k!==OPP[s[0]]); return s.slice(); }
  return ['u','d','r','l','f','b'];
}
function rendre(){
  const q=document.getElementById('q'), B=document.getElementById('btns'); B.innerHTML='';
  document.getElementById('chemin').textContent = phrase();
  if(etape==='depart'){ q.textContent='1. Ça part de quoi ?';
    for(const k in DEPARTS) B.appendChild(btn(DEPARTS[k], 'or', ()=>{ etat.depart=k; etape='sens'; envoyerDepart(); })); }
  else if(etape==='sens'){ const l=legCourante(); q.textContent=(etat.legs.length&&l&&!l.fin?'':(etat.legs.length+1)+'. ')+'Dans quel sens ?';
    const ok=sensPermis(); const prev=l&&l.fin?l:null;
    for(const k of ['u','d','r','l','f','b']){ const b=btn(MOT[k], ok.includes(k)?'':'gris', ()=>{ if(!ok.includes(k)) return;
        if(prev&&prev.fin==='45'){ // 45 : composer avec le sens précédent (axe → diagonale, diagonale → axe)
          const ns = prev.sens.length===1 ? [prev.sens[0], k] : [k];
          etat.legs.push({sens:ns, marqueurs:[], fin:null}); etape='bout'; }
        else { etat.legs.push({sens:[k], marqueurs:[], fin:null}); etape='bout'; } }); B.appendChild(b); }
    if(!prev || prev.fin==='90'){ B.appendChild(btn('En 45 ↗', 'gris large', ()=>{ etape='sens45'; attente=null; }, 'deux sens combinés')); }
  }
  else if(etape==='sens45'){ q.textContent = attente ? 'Le 45 : '+MOT45[attente]+' … et ?' : 'Le 45 : premier sens ?';
    const ok = attente ? ['u','d','r','l','f','b'].filter(k=>k!==attente&&k!==OPP[attente]) : sensPermis();
    for(const k of ['u','d','r','l','f','b']) B.appendChild(btn(MOT45[k], ok.includes(k)?'':'gris', ()=>{ if(!ok.includes(k)) return;
      if(!attente){ attente=k; } else { etat.legs.push({sens:[attente,k], marqueurs:[], fin:null}); attente=null; etape='bout'; } })); }
  else if(etape==='bout'){ q.textContent='Au bout de ce tronçon, il y a quoi ?';
    B.appendChild(btn('90', '', ()=>{ legCourante().fin='90'; etape='sens'; }));
    B.appendChild(btn('45', '', ()=>{ legCourante().fin='45'; etape='sens'; }));
    B.appendChild(btn('Té + purge', 'vert', ()=>{ legCourante().marqueurs.push('te'); }, 'en ligne, ça continue'));
    B.appendChild(btn('Valve', 'or', ()=>{ legCourante().marqueurs.push('valve'); }, 'en ligne, ça continue'));
    B.appendChild(btn('Union', '', ()=>{ legCourante().marqueurs.push('union'); }, 'en ligne, ça continue'));
    B.appendChild(btn('C\'est la FIN', 'rouge', ()=>{ etape='fin'; })); }
  else if(etape==='fin'){ q.textContent='La fin, c\'est quoi ?';
    for(const k in FINS) B.appendChild(btn(FINS[k], k==='te'?'vert':'or', ()=>{ legCourante().fin='fin:'+k; etat.fini=true; etape='termine'; })); }
  else if(etape==='termine'){ q.textContent='Chemin complet. Envoie-le à Claude, puis donne les mesures à la voix.';
    B.appendChild(btn('Envoyer à Claude ➤', 'vert large', envoyer)); }
  dessiner();
}
document.getElementById('annuler').onclick=()=>{ const h=hist.pop(); if(!h) return; const o=JSON.parse(h); etat=o.etat; etape=o.etape; attente=o.attente; rendre(); };

// ---------- réseau ----------
const API = (location.hostname.endsWith('ts.net')||location.hostname==='127.0.0.1') ? '' : 'https://michael-system-product-name.tail362e86.ts.net';
async function post(url, body){ const ctl=new AbortController(); setTimeout(()=>ctl.abort(), 8000);
  const r=await fetch(API+url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),signal:ctl.signal}); return r.json(); }
async function envoyerDepart(){ if(departEnvoye) return; departEnvoye=true;   // le chrono part au PREMIER geste de la section
  try{ const j=await post('/c/api/depart', {slot, nom}); document.getElementById('msg').textContent=j.message||''; }catch(e){ document.getElementById('msg').textContent='PC injoignable pour le chrono (pas grave, continue).'; } }
async function envoyer(){ try{ const j=await post('/c/api/chemin', {slot, nom, depart:etat.depart, legs:etat.legs, phrase:phrase(), ts:Date.now()});
    document.getElementById('msg').textContent=j.message||'envoyé'; }catch(e){ document.getElementById('msg').textContent='PC injoignable : dis le chemin à Claude au casque : '+phrase(); } }
addEventListener('resize', resize); resize(); rendre();
</script></body></html>
