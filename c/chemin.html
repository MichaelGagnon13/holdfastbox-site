<script type="module">
// ---------- moteur 3D du constructeur : le même look que les pages finies (Michael 25 sept. : « du 2D dans le 3D, pas vraiment 3D ») ----------
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const holder=document.getElementById('gl');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1c2230);
const cam=new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
const ren=new THREE.WebGLRenderer({antialias:true}); ren.setPixelRatio(Math.min(devicePixelRatio,2)); holder.appendChild(ren.domElement);

const K=20, R=0.66;                       // 1 unité de tronçon = 20 ; rayon du 1 1/4 comme sur les pages finies

function cyl(A,B,r,color){ const L=A.distanceTo(B); if(L<1e-6) return; const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,24), new THREE.MeshStandardMaterial({color, roughness:.6}));

  if(!P3||P3.length<1) return;

  P3.forEach(p=>box.expandByPoint(W(p)));
  legs.forEach((l,i)=>{ const A=W(P3[i]), B=W(P3[i+1]); const dir=B.clone().sub(A).normalize(); const L=A.distanceTo(B);
    cyl(A,B,R,0xdfe6f0);
    l.marqueurs.forEach((m,k)=>{ const tt=(k+1)/(l.marqueurs.length+1); const C=A.clone().lerp(B,tt); const h=dir.clone().multiplyScalar(m==='valve'?1.6:1.1);
      if(m==='valve') cyl(C.clone().sub(h), C.clone().add(h), R*1.7, 0xf0c030);
      else if(m==='union') cyl(C.clone().sub(h), C.clone().add(h), R*1.5, 0x4a90e2);
      else { sph(C, R*1.5, 0x1a9a3a); cyl(C, C.clone().add(new THREE.Vector3(0,-4,0)), R, 0x1a9a3a); } });
    if(l.fin==='90'||l.fin==='45') sph(B, R*1.45, 0x0b4f9c);
    else if(l.fin==='te90'){ sph(B, R*1.5, 0x1a9a3a); cyl(B, B.clone().add(dir.clone().multiplyScalar(4)), R, 0x1a9a3a); }
    else if(l.fin==='fin:te'){ sph(B, R*1.5, 0x1a9a3a); cyl(B, B.clone().add(new THREE.Vector3(0,-4,0)), R, 0x1a9a3a); }
    else if(l.fin==='fin:coude') sph(B, R*1.45, 0x0b4f9c);
    else if(l.fin==='fin:bague') cyl(B.clone().sub(dir.clone().multiplyScalar(1.2)), B.clone().add(dir.clone().multiplyScalar(1.2)), R*1.4, 0xffd34d);
    else if(l.fin==='fin:bout') cyl(B, B.clone().add(dir.clone().multiplyScalar(6)), R, 0x8f98a8);   // le tuyau existant continue
  });

  const tri=new THREE.Group(); P3.forEach((p,i)=>{ const O=W(p); for(const [d,c] of [[[0.3,0,0],0x7fb3ff],[[0,-0.3,0],0x7ee38a],[[0,0,0.3],0xff8a80]]){ const g=new THREE.BufferGeometry().setFromPoints([O, W([p[0]+d[0],p[1]+d[1],p[2]+d[2]])]); tri.add(new THREE.Line(g, new THREE.LineBasicMaterial({color:c, transparent:true, opacity:i?0.45:0.9}))); } }); grp.add(tri);

}
function resetVue(){ userMoved=false; fitted=false; }

// ---------- repère : face au tap, le main dans le dos ----------

const MOT = {u:'je monte', d:'je descends', r:'vers la droite', l:'vers la gauche', f:'vers l\'arrière', b:'tout droit'};

function dirLeg(l){ const v=[0,0,0]; for(const s of l.sens){ v[0]+=V3[s][0]; v[1]+=V3[s][1]; v[2]+=V3[s][2]; } return v; }
function legCourante(){ return etat.legs[etat.legs.length-1]; }
function phrase(){
  if(!etat.depart) return '';
  const p=[DEPARTS[etat.depart]];
  for(const l of etat.legs){
    if(l.sens.length===2) p.push(MOT45[l.sens[0]]+' '+MOT45[l.sens[1]]); else p.push(MOT[l.sens[0]]);
    for(const m of l.marqueurs) p.push(MARQ[m].toLowerCase());

}

// ---------- dessin iso ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

// ---------- dessin 3D qu'on tourne au doigt (Michael 24 sept. : « en 2D c'est dur, mauvaise perception spatiale ») ----------
let yaw=-0.62, pitch=0.42, drag=null, zoom=1, panX=0, panY=0; const ptrs=new Map(); let pinch=null;   // zoom : pincer, molette ; déplacer : deux doigts                    // vue de départ : trois-quarts, comme l'iso d'avant
function p3(){ const P=[[0,0,0]]; etat.legs.forEach((l,i)=>{ const u=vecU(l.sens); const q=P[P.length-1]; const Li=1+0.35*(i%4); P.push([q[0]+u[0]*Li, q[1]+u[1]*Li, q[2]+u[2]*Li]); }); return P; }
function rot(p){ const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const x1=p[0]*cy-p[1]*sy, y1=p[0]*sy+p[1]*cy; const z2=y1*sp+p[2]*cp; return [x1, -z2]; }

  const zmin=Math.min(...P3.map(p=>p[2]))-0.15, xs=P3.map(p=>p[0]), ys=P3.map(p=>p[1]);
  const gx0=Math.floor(Math.min(...xs))-0.5, gx1=Math.ceil(Math.max(...xs))+0.5, gy0=Math.floor(Math.min(...ys))-0.5, gy1=Math.ceil(Math.max(...ys))+0.5;
  const G=[]; for(let x=gx0;x<=gx1;x+=0.5) G.push([rot([x,gy0,zmin]),rot([x,gy1,zmin])]); for(let y=gy0;y<=gy1;y+=0.5) G.push([rot([gx0,y,zmin]),rot([gx1,y,zmin])]);

  const base=Math.min(W,H)/4.2; const sc=Math.min(base, (W-70)/Math.max(maxx-minx,0.5),(H-70)/Math.max(maxy-miny,0.5))*zoom; const ox=W/2-(minx+maxx)/2*sc+panX, oy=H/2-(miny+maxy)/2*sc+panY;

      ctx.strokeStyle='rgba(159,208,255,.35)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(pc[0],pc[1]); ctx.lineTo(V[0],V[1]); ctx.stroke(); ctx.fillStyle='rgba(159,208,255,.65)'; ctx.font='9px sans-serif'; ctx.textAlign='center'; ctx.fillText(lab, V[0], V[1]-2); } }
  ctx.lineCap='round'; ctx.lineJoin='round';
  etat.legs.forEach((l,i)=>{ const a=P[i], b=P[i+1];
    const Qs=(etape==='mesures'&&etat.sel!=null)?questions()[etat.sel]:null; ctx.strokeStyle=(Qs&&Qs.leg===i)?'#ffd34d':'#dfe6f0'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();

      ctx.fillStyle = m==='valve'?'#f39c12':(m==='union'?'#2f61b8':'#1a9a3a'); ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill();
      if(m==='te'){ const D=S(rot([P3[i][0],P3[i][1],P3[i][2]-0.35])); const O=S(rot(P3[i])); ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+(D[0]-O[0]),y+(D[1]-O[1])); ctx.stroke(); }
      ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText(m==='valve'?'V':(m==='union'?'U':'T'), x, y+4); });
    if(l.fin==='te90'){ const ux=(b[0]-a[0])/(Math.hypot(b[0]-a[0],b[1]-a[1])||1), uy=(b[1]-a[1])/(Math.hypot(b[0]-a[0],b[1]-a[1])||1);
      ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(b[0],b[1]); ctx.lineTo(b[0]+ux*24,b[1]+uy*24); ctx.stroke();
      ctx.fillStyle='#1a9a3a'; ctx.beginPath(); ctx.arc(b[0],b[1],10,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText('T', b[0], b[1]+4); }
    else if(l.fin==='90'||l.fin==='45'){ ctx.fillStyle='#0b4f9c'; ctx.beginPath(); ctx.arc(b[0],b[1],9,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText(l.fin, b[0], b[1]+4); }
    else if(l.fin&&l.fin.startsWith('fin:')){ const t=l.fin.slice(4); ctx.fillStyle = t==='te'?'#1a9a3a':'#ffd34d'; ctx.beginPath(); ctx.arc(b[0],b[1],11,0,7); ctx.fill();
      if(t==='te'){ const D=S(rot([P3[i+1][0],P3[i+1][1],P3[i+1][2]-0.4])); ctx.strokeStyle='#1a9a3a'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(b[0],b[1]); ctx.lineTo(D[0],D[1]); ctx.stroke(); }
      ctx.fillStyle='#ffd34d'; ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.fillText('FIN '+FINS[t].split(' ')[0].toUpperCase(), b[0]+14, b[1]-14); }

  });
  ctx.fillStyle='#ffd34d'; ctx.beginPath(); ctx.arc(p0[0],p0[1],10,0,7); ctx.fill();
  ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.fillText(DEPARTS[etat.depart].toUpperCase(), p0[0]+14, p0[1]+5);
  if(!etat.fini){ const q=P[P.length-1]; ctx.strokeStyle='#ffd34d'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(q[0],q[1],16,0,7); ctx.stroke(); ctx.setLineDash([]); }
  dessinerCotes(P3, S);

// ---------- mesures : pointillés de cote sur le 3D (Michael 24 sept. : « pas à la volée avec du texte ») ----------
function vecU(sens){ const v=[0,0,0]; for(const s of sens){ v[0]+=V3[s][0]; v[1]+=V3[s][1]; v[2]+=V3[s][2]; } const n=Math.hypot(...v)||1; return v.map(x=>x/n); }
function estV(l){ return l.sens.length===1 && (l.sens[0]==='u'||l.sens[0]==='d'); }
function niveaux(){ // groupes de tronçons NON verticaux consécutifs au même niveau → une hauteur sous plafond par groupe
  const G=[]; let cur=null; etat.legs.forEach((l,k)=>{ if(estV(l)){ cur=null; return; } if(!cur){ cur={legs:[k]}; G.push(cur); } else cur.legs.push(k); }); return G;
}
function vertEntre(g1,g2){ // signe du vertical entre deux groupes (dernier vertical avant g2)
  let s=0; for(let k=g1.legs[g1.legs.length-1]+1;k<g2.legs[0];k++){ const l=etat.legs[k]; if(estV(l)) s=l.sens[0]==='u'?1:-1; } return s; }
function niveauxRevenus(){ // [ [gi, gj] ] : le groupe gi revient au niveau du groupe gj
  const G=niveaux(); const R=[]; for(let gi=2;gi<G.length;gi++){ const a=vertEntre(G[gi-2],G[gi-1]), b=vertEntre(G[gi-1],G[gi]); if(a&&b&&a===-b) R.push([gi,gi-2]); } return R; }
function axesDetour(){ // axe où le chemin part d'un côté puis revient (l puis r, f puis b…) : on propose « revient dans l'axe » (écart 0)
  const A={}; for(const [ax,plus,moins] of [['x','r','l'],['y','b','f']]){ let p=0,mn=0; etat.legs.forEach(l=>{ if(l.sens.includes(plus)) p++; if(l.sens.includes(moins)) mn++; }); if(p&&mn) A[ax]=true; } return A;
}

    const egal=(etat.mes||{}).nivegal!==false; const rev=egal?niveauxRevenus().map(x=>x[0]):[];
    niveaux().forEach((g,gi)=>{ const k=g.legs[0]; const r=rev.includes(gi); Q.push({id:'N'+k, leg:k, grp:g.legs, titre:'Plafond → axe du tuyau, tronçon'+(g.legs.length>1?'s '+g.legs.map(x=>x+1).join('-'):' '+(k+1)), sous:r?'revient à la hauteur d\'avant le détour (décoche « même hauteur » si non)':'la hauteur de cette ligne sous le plafond', opt:r}); }); }

  etat.legs.forEach((l,k)=>{ if(!estV(l)) return; const fixe=etat.cons.longs[k]!=null, min=!!etat.cons.min[k]; Q.push({id:'L'+k, leg:k, titre:'Tronçon '+(k+1)+' (vertical) : centre à centre', sous:'optionnel : je le déduis des hauteurs', opt:true, fixe, min}); });
  if(vert && niveauxRevenus().length) Q.push({id:'nivegal', titre:'Après un détour (descend puis monte), la ligne revient à la même hauteur ?', sous:'oui par défaut · touche pour dire non', opt:true});
  const usedX=etat.legs.some(l=>l.sens.includes('r')||l.sens.includes('l')), usedY=etat.legs.some(l=>l.sens.includes('b')||l.sens.includes('f'));
  if(usedY) Q.push({id:'dy', titre:'Tap → arrivée, devant-derrière (deux points qui existent)', sous:'au galon le long du mur · remplace la dernière longueur vers le té', cote:[['b','arrivée DEVANT'],['f','arrivée DERRIÈRE']], opt:true, ecart:true});

    if(plan.ordre&&plan.ordre.length){ Q.sort((a,b)=>{ const ia=plan.ordre.indexOf(a.id), ib=plan.ordre.indexOf(b.id); return (ia<0?99:ia)-(ib<0?99:ib); }); } }

let cur={po:'', f:0, c:null}; let hits=[];
function fmt16(v){ if(v==null) return '—'; const po=Math.floor(v/16), f=v%16; const g=(a,b)=>b?g(b,a%b):a; const d=g(f,16); return (po?po:'')+(f?(po?' ':'')+(f/d)+'/'+(16/d):'')+' po'; }

function valeurQ(Qc){ const m=etat.mes||{}; if(Qc.id==='dx'||Qc.id==='dy') return m[Qc.id]?m[Qc.id].v:null; if(Qc.id.startsWith('L')) return (m.longs||{})[Qc.id.slice(1)]; if(Qc.id.startsWith('N')) return (m.niv||{})[Qc.id.slice(1)]; if(Qc.id.startsWith('axe0')) return m[Qc.id]===false?null:0; if(Qc.id==='nivegal') return m.nivegal===false?null:0;
  if(Qc.id.startsWith('M')){ const [i,k]=Qc.id.slice(1).split('_'); return ((m.pos||{})[i]||{})[k]; } return m[Qc.id]; }
function poserQ(Qc, v){ etat.mes=etat.mes||{}; if(Qc.id==='dx'||Qc.id==='dy'){ etat.mes[Qc.id]=v==null?null:{v, c:cur.c}; return; } if(Qc.id.startsWith('L')) (etat.mes.longs=etat.mes.longs||{})[Qc.id.slice(1)]=v; else if(Qc.id.startsWith('N')) (etat.mes.niv=etat.mes.niv||{})[Qc.id.slice(1)]=v; else if(Qc.id==='nivegal'){ etat.mes.nivegal=(v===0||v==null); } else if(Qc.id.startsWith('axe0')){ etat.mes[Qc.id]=(v===0||v==null)?true:false; etat.mes[Qc.id==='axe0x'?'dx':'dy']=(v===0||v==null)?null:{v, c:cur.c||(Qc.id==='axe0x'?'r':'b')}; }
  else if(Qc.id.startsWith('M')){ const [i,k]=Qc.id.slice(1).split('_'); const P=(etat.mes.pos=etat.mes.pos||{}); (P[i]=P[i]||{})[k]=v; } else etat.mes[Qc.id]=v; }
function connuL(k){ const m=etat.mes||{}; return ((m.longs||{})[k]!=null) || etat.cons.longs[k]!=null || !!etat.cons.min[k]; }
function equations(){ // lignes du système A·L = b (on ne garde que A pour le rang)
  const N=etat.legs.length; const U=etat.legs.map(l=>vecU(l.sens)); const m=etat.mes||{}; const rows=[];
  for(let k=0;k<N;k++){ if(connuL(k)){ const r=new Array(N).fill(0); r[k]=1; rows.push(r); } }
  if(m.plafA!=null&&m.plafB!=null) rows.push(U.map(u=>u[2]));
  if(m.plafA!=null) for(const k in (m.niv||{})){ if(m.niv[k]==null) continue; const r=new Array(N).fill(0); for(let i=0;i<+k;i++) r[i]=U[i][2]; rows.push(r); }   // z du début du tronçon k = plafA − niv_k
  if(m.nivegal!==false){ const G=niveaux(); for(const [gi,gj] of niveauxRevenus()){ if(((m.niv||{})[G[gi].legs[0]])!=null) continue; const k0=G[gj].legs[0], kg=G[gi].legs[0]; const r=new Array(N).fill(0); for(let i=0;i<kg;i++) r[i]+=U[i][2]; for(let i=0;i<k0;i++) r[i]-=U[i][2]; rows.push(r); } }
  if(m.dx || m.axe0x!==false && axesDetour().x) rows.push(U.map(u=>u[0]));
  if(m.dy || m.axe0y!==false && axesDetour().y && m.axe0y===true) rows.push(U.map(u=>u[1]));
  return rows;
}
function complet(){ const N=etat.legs.length; if(!N) return false; return rangN(equations(),N)===N; }
function deduit(k){ // le tronçon k est-il déjà déterminé par ce qu'on sait (rang inchangé si on ajoute son équation) ?
  const N=etat.legs.length; const rows=equations(); const r=new Array(N).fill(0); r[k]=1; return rangN(rows,N)===rangN(rows.concat([r]),N); }
function rangN(rows,N){ const M=rows.map(r=>r.slice()); let r=0; for(let c=0;c<N&&r<M.length;c++){ let piv=-1; for(let i=r;i<M.length;i++){ if(Math.abs(M[i][c])>1e-9){piv=i;break;} } if(piv<0) continue;
  [M[r],M[piv]]=[M[piv],M[r]]; for(let i=0;i<M.length;i++){ if(i!==r&&Math.abs(M[i][c])>1e-9){ const f=M[i][c]/M[r][c]; M[i]=M[i].map((a,j)=>a-f*M[r][j]); } } r++; } return r; }

    // liste des cotes en boutons (les pastilles se cachent l'une l'autre quand le chemin est long, Michael 24 sept. 16:55)
    Q.forEach((Qc,qi)=>{ const v=valeurQ(Qc); const lab=(Qc.id.startsWith('L')?'T'+(Qc.leg+1):(Qc.id.startsWith('N')?'⌂'+(Qc.leg+1):(Qc.id.startsWith('M')?({te:'T',valve:'V',union:'U'}[Qc.m]+(Qc.leg+1)):(Qc.id==='plafA'?'⌂A':(Qc.id==='plafB'?'⌂B':(Qc.id==='axe0x'?'↔ axe':(Qc.id==='axe0y'?'↕ axe':(Qc.id==='dy'?'⇢ tap→arr':'◇'))))))));

      if(Qc.id.startsWith('axe0')){ const on=(etat.mes||{})[Qc.id]!==false; const b=btn(lab+' '+(on?'= 0 ✔':'écart donné'), on?'vert':'or', ()=>{ etat.sel=qi; cur={po:'',f:0,c:null}; }); b.classList.add('k'); B.appendChild(b); return; }

    if(complet()) B.appendChild(btn('Envoyer à Claude ➤', 'vert large', envoyer, 'je calcule et je te dis les coupes'));
    return; }
  q.innerHTML=sel.titre+'<span class="petit">'+sel.sous+'</span>';
  const aff=document.createElement('div'); aff.className='aff'; aff.textContent=(cur.po||'0')+(cur.f?' '+fmt16(cur.f).replace(' po',''):'')+' po'; B.appendChild(aff);
  const pad=document.createElement('div'); pad.className='pad';
  for(const d of ['7','8','9','4','5','6','1','2','3','⌫','0','C']){ const b=document.createElement('button'); b.className='btn k'; b.textContent=d;
    b.onclick=()=>{ if(d==='⌫') cur.po=cur.po.slice(0,-1); else if(d==='C'){cur.po='';cur.f=0;} else if(cur.po.length<3) cur.po+=d; rendre(); }; pad.appendChild(b); }
  B.appendChild(pad);
  const fr=document.createElement('div'); fr.className='frac';
  for(let n=0;n<16;n++){ const b=document.createElement('button'); b.className='btn k'+(cur.f===n?' sel':''); b.textContent=n?fmt16(n).replace(' po',''):'0'; b.onclick=()=>{ cur.f=n; rendre(); }; fr.appendChild(b); }
  B.appendChild(fr);

// dessin des cotes : appelé par dessiner() avec les points 3D et la projection écran
function dessinerCotes(P3, S0, direct){
  hits=[]; if(etape!=='mesures') return; const Q=questions(); const N=P3.length-1; const S=direct?S0:(p=>S0(rot(p)));   // points 3D → écran (three.js) ou tournés (repli 2D)
  const perp=(a,b,off)=>{ const vx=b[0]-a[0], vy=b[1]-a[1], n=Math.hypot(vx,vy)||1; return [[a[0]-vy/n*off,a[1]+vx/n*off],[b[0]-vy/n*off,b[1]+vx/n*off]]; };
  const zmax=Math.max(...P3.map(p=>p[2]))+0.45;
  Q.forEach((Qc,qi)=>{
    let a,b,off=26;
    if(Qc.id.startsWith('L')){ a=P3[Qc.leg]; b=P3[Qc.leg+1]; off=-(40+14*(Qc.leg%2)); }
    else if(Qc.id==='plafA'){ a=P3[0]; b=[P3[0][0],P3[0][1],zmax]; off=30; }
    else if(Qc.id==='plafB'){ a=P3[N]; b=[P3[N][0],P3[N][1],zmax]; off=-30; }
    else if(Qc.id.startsWith('M')){ const l=etat.legs[Qc.leg]; const t=(Qc.k+1)/(l.marqueurs.length+1); const A=P3[Qc.leg], Bp=P3[Qc.leg+1]; a=A; b=[A[0]+(Bp[0]-A[0])*t, A[1]+(Bp[1]-A[1])*t, A[2]+(Bp[2]-A[2])*t]; off=(56+16*Qc.k); }
    else if(Qc.id.startsWith('N')){ const c=P3[Qc.leg]; a=c; b=[c[0],c[1],zmax]; off=44; }
    else if(Qc.id==='dy'){ a=P3[0]; b=[P3[0][0],P3[N][1],P3[0][2]]; off=-60; }
    else if(Qc.id==='diag'){ a=P3[0]; b=P3[N]; off=70; }
    else if(Qc.id.startsWith('axe0')||Qc.id==='nivegal'){ return; }
    if(!a) return;
    const [sa,sb]=perp(S(a),S(b),off); const v=valeurQ(Qc); const sel=etat.sel===qi; const calc=Qc.fixe||Qc.min||(v==null&&Qc.id.startsWith('L')&&deduit(Qc.leg));
    ctx.setLineDash([6,5]); ctx.lineWidth=sel?3:2; ctx.strokeStyle= calc?'#5a6272':(v!=null?'#7ee38a':(Qc.opt?'#8a93a3':'#ffd34d')); ctx.beginPath(); ctx.moveTo(sa[0],sa[1]); ctx.lineTo(sb[0],sb[1]); ctx.stroke(); ctx.setLineDash([]);
    // petits traits d'appel
    ctx.lineWidth=1; ctx.beginPath(); const A0=S(a),B0=S(b); ctx.moveTo(A0[0],A0[1]); ctx.lineTo(sa[0],sa[1]); ctx.moveTo(B0[0],B0[1]); ctx.lineTo(sb[0],sb[1]); ctx.stroke();
    const fr=(Qc.id.startsWith('N')||Qc.id==='plafA'||Qc.id==='plafB')?0.72:(0.5+0.18*((qi%3)-1)); const mx=sa[0]+(sb[0]-sa[0])*fr, my=sa[1]+(sb[1]-sa[1])*fr; const txt=calc?(Qc.min?'min':(Qc.fixe?fmt16(etat.cons.longs[Qc.leg]):'calculé')):(v!=null?fmt16(v):'?'); const pre=Qc.id.startsWith('M')?({te:'T',valve:'V',union:'U'}[Qc.m]+' '):(Qc.id==='plafA'||Qc.id==='plafB'||Qc.id.startsWith('N')?'⌂ ':(Qc.id==='diag'?'◇ ':''));
    ctx.font='bold 13px sans-serif'; const w=ctx.measureText(pre+txt).width+16;
    ctx.fillStyle= calc?'#3a4150':(v!=null?'#2eaa48':(Qc.opt?'#4a5263':'#f39c12')); if(sel) ctx.fillStyle='#ffd34d';
    ctx.beginPath(); ctx.roundRect(mx-w/2,my-12,w,24,8); ctx.fill();
    ctx.fillStyle= (v==null&&Qc.opt&&!sel)?'#dfe6f0':'#111'; ctx.textAlign='center'; ctx.fillText(pre+txt, mx, my+5);
    if(!calc) hits.push({x:mx,y:my,w:w/2+8,qi});
  });
}
