<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Coupes — sections</title>
<style>
 html,body{margin:0;height:100%;background:#151b26;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#eef;overflow:hidden}
 #app{display:flex;height:100%}
 #bande{width:64px;flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 4px;box-sizing:border-box;
   background:linear-gradient(180deg,#2b3648,#1a2230);border-right:1px solid #3a4658;box-shadow:inset -6px 0 12px rgba(0,0,0,.35)}
 .btn{display:block;width:100%;border:0;border-radius:11px;padding:7px 2px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;
   text-shadow:0 1px 1px rgba(0,0,0,.6);position:relative;overflow:hidden;
   background:linear-gradient(180deg,#5b8ad8 0%,#2f61b8 48%,#244f9f 52%,#3a74d6 100%);
   box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.35)}
 .btn::before{content:"";position:absolute;left:6%;right:6%;top:2px;height:45%;border-radius:12px 12px 40% 40%;
   background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.05))}
 .btn small{display:block;font-weight:400;font-size:9px;opacity:.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .btn.vide{background:linear-gradient(180deg,#5a6272,#3a4150 48%,#30363f 52%,#454c58);opacity:.55;cursor:default}
 .btn.actif{background:linear-gradient(180deg,#ffd34d 0%,#f39c12 48%,#d9820a 52%,#ffb42e 100%);color:#2a1b00;text-shadow:0 1px 0 rgba(255,255,255,.5);
   box-shadow:0 0 14px rgba(255,180,50,.75),inset 0 1px 0 rgba(255,255,255,.7)}
 #chrono{margin-top:auto;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:#9fd0ff}
 #chrono small{display:block;font-size:10px;font-weight:400;color:#8a93a3}
 #fait{background:linear-gradient(180deg,#7ee38a 0%,#2eaa48 48%,#22903a 52%,#4cc665 100%);font-size:12px}
 #fait.confirme{background:linear-gradient(180deg,#ff8a80 0%,#e53935 48%,#c62828 52%,#ff5252 100%)}
 #hist{font-size:10px;color:#9fb;text-align:center;text-decoration:none;padding:4px 0}
 #vue{flex:1;border:0;background:#1c2230}
 #msg{position:fixed;left:70px;bottom:8px;font-size:12px;color:#8a93a3}
</style></head><body>
<div id="app">
 <div id="bande">
  <div id="btns"></div>
  <div id="chrono">--:--<small>en cours</small></div>
  <button class="btn" id="fait">✓ Fait</button>
  <a id="hist" href="https://michael-system-product-name.tail362e86.ts.net/c/historique.html">historique</a>
  <a id="hist" href="/c/legende.html">légende</a>
  <a id="hist" href="/c/dessin.html">✏ dessiner</a>
 </div>
 <iframe id="vue" src="about:blank"></iframe>
</div>
<div id="msg"></div>
<script>
const API = 'https://michael-system-product-name.tail362e86.ts.net';
let etat = null, actif = null, tokAffiche = null, armeFait = 0;
const pad = n => String(n).padStart(2,'0');
function rendre(){
  const b = document.getElementById('btns'); b.innerHTML = '';
  for (let i = 1; i <= 5; i++){
    const s = etat.sections[String(i)];
    const el = document.createElement('button'); el.className = 'btn' + (s ? (String(i) === actif ? ' actif' : '') : ' vide');
    el.innerHTML = 'S' + i + '<small>' + (s ? s.nom : '—') + '</small>';
    if (s) el.onclick = () => { actif = String(i); rendre(); };
    b.appendChild(el);
  }
  const s = etat.sections[actif];
  const vue = document.getElementById('vue');
  if (s && s.tok && s.tok !== tokAffiche){ vue.src = '/c/' + s.tok + '.html?t=' + s.maj; tokAffiche = s.tok; }
  if (s && !s.tok && tokAffiche !== 'dictee'){ vue.src = 'data:text/html;charset=utf-8,' + encodeURIComponent('<body style="background:#1c2230;color:#9fd0ff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-size:22px">' + s.nom + ' — en dictée, croquis à venir…</body>'); tokAffiche = 'dictee'; }
  if (!s){ vue.src = 'about:blank'; tokAffiche = null; }
  document.getElementById('fait').style.visibility = s ? 'visible' : 'hidden';
}
function tic(){
  const s = etat && etat.sections[actif];
  const c = document.getElementById('chrono');
  if (!s){ c.innerHTML = '--:--<small>aucune section</small>'; return; }
  const fin = s.pause ? s.pause : Date.now()/1000;
  const d = Math.floor(fin - s.debut), h = Math.floor(d/3600), m = Math.floor(d%3600/60), sec = d%60;
  c.innerHTML = (h ? h + ':' : '') + pad(m) + ':' + pad(sec) + '<small>' + (s.pause ? '⏸ en pause · ' : '') + s.nom + '</small>';
}
async function charger(){
  try {
    const r = await fetch('/c/etat.json?t=' + Date.now(), {cache:'no-store'}); const e = await r.json();
    const premier = !etat; etat = e;
    if (premier || !etat.sections[actif]) actif = e.actif && e.sections[e.actif] ? e.actif : Object.keys(e.sections)[0] || null;
    rendre(); tic();
  } catch(err){ document.getElementById('msg').textContent = 'PC injoignable : ' + err; }
}
document.getElementById('fait').onclick = async () => {
  const btn = document.getElementById('fait');
  if (!armeFait){ armeFait = 1; btn.textContent = 'Confirmer ?'; btn.classList.add('confirme');
    setTimeout(() => { armeFait = 0; btn.textContent = '✓ Fait'; btn.classList.remove('confirme'); }, 4000); return; }
  armeFait = 0; btn.textContent = '✓ Fait'; btn.classList.remove('confirme');
  let j; try { const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000); const r = await fetch(API+'/c/api/fait?slot=' + actif, {method:'POST', signal: ctl.signal}); j = await r.json(); } catch(e) { j = {message: 'PC injoignable : dis « section faite » à Claude.'}; }
  document.getElementById('msg').textContent = j.message || '';
  etat = null; await charger();
};
charger(); setInterval(charger, 30000); setInterval(tic, 1000);
</script></body></html>
